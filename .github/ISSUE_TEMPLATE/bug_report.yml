name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Before filing a security issue, read SECURITY.md and use private vulnerability reporting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest policy and command that reproduce the issue. Remove credentials, SSO tokens, private profile names, and other private data.
      placeholder: |
        1. Configure ...
        2. Start Pi ...
        3. Enter ...
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: pi-aws-assume version or commit
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Output of `pi --version`.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs or other relevant context. Remove secrets and private data.
